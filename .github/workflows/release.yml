name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch make cross
            mv fpm-wg fpm-wg-linux-$arch
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fpm-wg-linux-amd64
            fpm-wg-linux-arm64
